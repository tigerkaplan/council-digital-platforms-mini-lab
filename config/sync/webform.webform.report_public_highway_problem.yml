id: report_public_highway_problem
title: 'Report a problem on a public highway'
description: '<p>Personal learning project webform for reporting fictional public-highway service issues. Uses fictional data only.</p>'
categories: {  }
elements: |-
  problem_type:
    '#type': select
    '#title': 'What is the problem?'
    '#options':
      faulty_streetlight: 'Faulty streetlight'
      missed_bin_collection: 'Missed bin collection'
      pothole: Pothole
      other: Other
    '#empty_option': '- Select a problem type -'
    '#required': true
  location_description:
    '#type': textarea
    '#title': 'Where is the problem?'
    '#required': true
    '#help': '<p>Include a nearby house number, street name or landmark. For example, outside number 24 on Example Street.</p>'
  postcode:
    '#type': textfield
    '#title': Postcode
    '#help': '<p>Enter the postcode nearest to the problem, for example BN3 1AA.</p>'
    '#required': true
    '#required_error': 'Enter a postcode, for example BN3 1AA.'
  immediate_safety_risk:
    '#type': radios
    '#title': 'Is there an immediate safety risk?'
    '#help': '<p>Tell us if the problem could cause immediate harm to someone.</p>'
    '#options':
      yes_immediate: 'Yes – someone could be harmed now'
      yes_not_immediate: 'Yes – there is a risk, but it is not immediate'
      'no': 'No'
    '#required': true
  risk_details:
    '#type': textarea
    '#title': 'Tell us about the immediate safety risk'
    '#help': '<p>Explain what could happen, who may be affected and where the risk is.</p>'
    '#states':
      visible:
        ':input[name="immediate_safety_risk"]':
          value: yes_immediate
      required:
        ':input[name="immediate_safety_risk"]':
          value: yes_immediate
  additional_information:
    '#type': textarea
    '#title': 'Is there anything else we should know?'
    '#help': '<p>Add any other information that may help us understand or locate the problem. You can leave this blank.</p>'
  contact_name:
    '#type': textfield
    '#title': 'Your name'
    '#help': '<p>Enter the name we should use if we need to contact you.</p>'
    '#required': true
  asset_reference:
    '#type': textfield
    '#title': 'Streetlight reference (optional)'
    '#help': '<p>You can find this reference number on the streetlight column. Leave this blank if you cannot see one.</p>'
  email_address:
    '#type': email
    '#title': 'Email address'
    '#help': '<p>Enter an email address we can use to contact you about this report.</p>'
    '#required': true
    '#required_error': 'Enter an email address we can use to contact you about this report.'
  preferred_contact_method:
    '#type': select
    '#title': 'How would you prefer us to contact you?'
    '#options':
      email: Email
      none: 'I do not need a response'
    '#empty_option': '- Select a contact method -'
    '#help': '<p>Choose how you would like us to contact you about this report.</p>'
  confirmation:
    '#type': checkbox
    '#title': 'I confirm that the information I have provided is correct'
    '#required': true
  actions:
    '#type': webform_actions
    '#submit__label': 'Send report'
